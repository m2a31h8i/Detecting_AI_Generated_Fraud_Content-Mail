<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>
    <style>
body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #03396c, #2189ab);
        }

        .login-box {
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            color: white;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .input-box input::placeholder {
            color: #ddd;
        }

        .options {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .options a {
            color: #fff;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            border: none;
            background: white;
            color: #03396c;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #e0e0e0;
        }

        .register {
            margin-top: 20px;
            font-size: 14px;
        }

        .register a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>FraudShield Login</h2>

        <div class="input-box">
            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <div class="options">
            <label><input type="checkbox"> Remember me</label>
            <a href="ForgotPassword.html">Forgot password?</a>
        </div>

        <button class="login-btn" onclick="window.location.href='Dashboard.html'">Login</button>

        <div class="register">
            Don't have an account? <a href="Signup.html">SignUp</a>
        </div>
    </div>

</body>
</html>
