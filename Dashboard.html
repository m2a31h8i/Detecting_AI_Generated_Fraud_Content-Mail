<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield</title>
    <style>

.main-content {
    margin-left: 120px;   /* Adjust this value if needed */
}

    body {
        font-family: Arial, sans-serif;
        margin: 0;
    }

    html {
    scroll-behavior: smooth;
    background-color: #f0faff;
    }

    .top-navbar {
    position: sticky;
    top: 0;
    background: #2189ab;
    background: radial-gradient(circle at center, #2189ab, #03396c);
    color: rgb(0, 0, 0);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 40px;
    z-index: 1000;
    position: relative;
    border-left-style: double;
    border-right-style: double;
    border-top-style: double;
    border-color: white;
}

.logo img {
    height: 50px;
    transition: transform 0.3s ease;
}

.logo img:hover {
    transform: scale(1.2);
}

.brand {
    position: absolute;
    left: 9%;
    transform: translateX(-50%);

    font-size: 30px;
    font-weight: bold;
    color: #24244a;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
    transition: transform 0.3s ease;
}

.brand:hover {
    transform: translateX(-50%) scale(1.2);
}

.brand::after {
    content: "";
    position: absolute;
    background-color: #03396c;
    transition: 0.3s ease;
}

.brand:hover::after {
    width: 100%;
}

.auth a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    padding: 8px 16px;
    border-radius: 5px;
    transition: 0.3s;
}

    .menu-navbar {
        background-color: #03396c;
        display: flex;
        justify-content: flex-end;
        padding: 10px 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #2189ab, #03396c);
        border-left-style: double;
        border-right-style: double;
        border-color: white;
    }

    .menu-navbar a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        text-decoration: none;
        margin: 0 20px;
        padding: 8px 12px;
        transition: 0.3s;
        border-radius: 4px;
    }

    .menu-navbar a:hover {
        background-color: #b3cde0;
        color: black;
    }

    .Sub-Heading {
    text-align: center;
    transition: transform 0.3s ease;
    background: radial-gradient(circle at center, #03396c, #2189ab);
    color: white; 
    padding: 10px; 
    border-radius: 20%; 
    border-style:double;
}

.Sub-Heading:hover {
    transform: scale(1.05);
}

#response {
    font-weight: bold; 
    padding-inline-start: 28%;
}

.contact-button {
    padding-inline-start: 27%;
    transition: transform 0.3s ease;
}

.contact-button:hover {
    transform: scale(1.1);
}

button {
            background-color: #03396c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

button:hover {
    background-color: #005b96;
}



</style>
</head>

<body>

        <nav class="top-navbar">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
        </div>

        <div class="brand">
            FRAUDSHIELD
        </div>

        <div class="auth">
            <a href="Login.html">Register</a>
        </div>
    </nav>

    <nav class="menu-navbar">
        <a href="Dashboard.html">Home</a> 
        <a href="Analysis.html" target="_blank">Analysis</a> 
        <a href="FullReport.html" target="_blank">Full Report</a> 
        <a href="#contact">Contact Us</a> 
        <a href="#help">Help</a> 
        <a href="Logout.html">Logout</a>
    </nav>

<div class="main-content">
    <section> 
        <h2>Welcome to FraudShield Dashboard</h2>
        <p>Here you can find insights and reports on fraud detection.</p>
    </section>
</div>

    <section id="contact"> 
        <h2 class="Sub-Heading">Contact Us</h2>
            <div id="response">
                <form>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name here"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email here" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="2" cols="90" placeholder="Enter your message here..."></textarea><br><br>

                <div class="contact-button">
                    <button>Submit</button>
                </div>
                </form>
            </div>
        <div class="main-content">
        <p>Email: fraudshield@gmail.com</p>
        <p>Phone: 9876543210</p>
        </div>
    </section>

    <section id="help">
        <h2 class="Sub-Heading">Help</h2>

        <div id="main-content">

    </div>
    </section>


</body>
</html>
