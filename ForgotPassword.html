<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #03396c, #2189ab);
}

.forgot-box {
    width: 350px;
    padding: 40px;
    border-radius: 15px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    color: white;
    text-align: center;
}

.forgot-box h2 {
    margin-bottom: 30px;
    letter-spacing: 1px;
}

.input-box {
    margin-bottom: 20px;
    text-align: left;
}

.input-box input {
    width: 100%;
    padding: 10px;
    border-radius: 25px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

.input-box input::placeholder {
    color: #ddd;
}

.submit-btn {
    width: 100%;
    padding: 10px;
    border-radius: 25px;
    border: none;
    background: white;
    color: #03396c;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #e0e0e0;
}

.back-login {
    margin-top: 20px;
    font-size: 14px;
}

.back-login a {
    color: white;
    font-weight: bold;
    text-decoration: none;
}

.back-login a:hover {
    text-decoration: underline;
}

.message {
    margin-top: 15px;
    font-size: 14px;
    color: #d0ffd0;
}
</style>
</head>
<body>

<div class="forgot-box">
    <h2>Forgot Password</h2>

    <div class="input-box">
        <input type="email" placeholder="Enter your registered email" id="email">
    </div>

    <button class="submit-btn" onclick="resetPassword()">Submit</button>

    <div class="message" id="message"></div>

    <div class="back-login">
        Remembered? <a href="Login.html">Back to Login</a>
    </div>
</div>

<script>
function resetPassword(){
    const email = document.getElementById('email').value.trim();
    const messageBox = document.getElementById('message');
    if(email){
        // For now, just simulate sending reset email
        messageBox.textContent = `If ${email} is registered, a password reset link has been sent!`;
        document.getElementById('email').value = '';
    } else {
        messageBox.textContent = 'Please enter your email.';
    }
}
</script>

</body>
</html>
